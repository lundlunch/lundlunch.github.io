name: Build and publish website

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'App.tsx'
      - 'main.tsx'
      - 'style.css'
      - 'dev.html'
      - 'menu-language.ts'
      - 'translation-seeds.json'
      - 'initial-menus.json'
      - 'package.json'
      - 'vite.config.ts'
      - 'build-site.mjs'
      - '.github/workflows/build-site.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: menu-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install
      - run: npm run build


      - name: Prepare website
        run: |
          mkdir -p public_site
          cp index.html index-*.js index-*.css menus.json translations.json public_site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public_site

      - uses: actions/deploy-pages@v4
