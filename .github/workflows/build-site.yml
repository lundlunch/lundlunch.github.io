name: Publish redirect website

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-redirect
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare redirect site
        run: |
          mkdir -p public_site
          cp index.html public_site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public_site
      - uses: actions/deploy-pages@v4
