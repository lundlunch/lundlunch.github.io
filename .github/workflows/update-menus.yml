name: Update menus
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1-5'
    - cron: '0,30 6-11 * * 1'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: menu-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node update-menus.mjs
      - name: Save updated menus
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add menus.json translations.json translation-quota.json
          git diff --staged --quiet || git commit -m 'Update lunch menus'
          git push
      - name: Prepare website
        run: |
          mkdir -p public_site
          cp index.html index-*.js index-*.css menus.json translations.json public_site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public_site
      - uses: actions/deploy-pages@v4
        id: deployment
