name: Update menus
on:
  workflow_dispatch:
  schedule:
    # Monday 06:00–11:50 Europe/Stockholm, including DST changes.
    - cron: '*/10 4-10 * * 1'
    # Tuesday–Friday: retain the existing 06:00 UTC schedule.
    - cron: '0 6 * * 2-5'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: menu-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check Monday Swedish-time window
        id: window
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ] || [ "$(TZ=Europe/Stockholm date +%u)" != "1" ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            hour=$(TZ=Europe/Stockholm date +%H)
            if [ "$hour" -ge 6 ] && [ "$hour" -lt 12 ]; then
              echo 'run=true' >> "$GITHUB_OUTPUT"
            else
              echo 'run=false' >> "$GITHUB_OUTPUT"
            fi
          fi
      - uses: actions/checkout@v4
        if: steps.window.outputs.run == 'true'
      - if: steps.window.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - if: steps.window.outputs.run == 'true'
        run: node update-menus.mjs
      - if: steps.window.outputs.run == 'true'
        name: Save updated menus
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add menus.json translations.json translation-quota.json
          git diff --staged --quiet || git commit -m 'Update lunch menus'
          git push
