name: Update menus
on:
  workflow_dispatch:
  schedule:
    # Monday every 10 minutes, staggered away from minute 0 to reduce scheduler congestion.
    # UTC hours cover both Swedish summer and winter time; runtime guard selects 06:00–11:59.
    - cron: '7,17,27,37,47,57 4-10 * * 1'
    # Friday 19:00 Europe/Stockholm (17 UTC summer, 18 UTC winter): Troppo only.
    - cron: '0 17,18 * * 5'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: menu-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check Swedish-time refresh window
        id: window
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          day=$(TZ=Europe/Stockholm date +%u)
          hour=$(TZ=Europe/Stockholm date +%H)
          echo "Event: $EVENT_NAME; UTC: $(date -u '+%Y-%m-%d %H:%M:%S'); Stockholm: $(TZ=Europe/Stockholm date '+%Y-%m-%d %H:%M:%S %Z'); weekday=$day hour=$hour"
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            echo 'troppo_only=false' >> "$GITHUB_OUTPUT"
          elif [ "$day" = "1" ] && [ "$hour" -ge 6 ] && [ "$hour" -lt 12 ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            echo 'troppo_only=false' >> "$GITHUB_OUTPUT"
          elif [ "$day" = "5" ] && [ "$hour" = "19" ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            echo 'troppo_only=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi
          echo "Decision: $(cat "$GITHUB_OUTPUT" | tr '\n' ' ')"
      - uses: actions/checkout@v4
        if: steps.window.outputs.run == 'true'
      - if: steps.window.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - if: steps.window.outputs.run == 'true'
        env:
          TROPPO_ONLY: ${{ steps.window.outputs.troppo_only }}
        run: node update-menus.mjs
      - if: steps.window.outputs.run == 'true'
        name: Save updated menus
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add menus.json translations.json translation-quota.json
          if git diff --staged --quiet; then
            echo 'No menu changes to save.'
            exit 0
          fi
          git commit -m 'Update lunch menus'
          # A code change or another workflow may advance main while scraping runs.
          # Rebase only our menu-data commit and retry, never force-push.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push attempt $attempt failed; retrying..."
            sleep 3
          done
          echo 'Could not safely publish menu updates.' >&2
          exit 1
